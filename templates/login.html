<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Personal AI Agent — Sign in</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #14191f;
      --border: #2a333e;
      --text: #e8edf2;
      --muted: #98a4b3;
      --accent: #7aa2f7;
      --danger: #f7768e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    form {
      width: min(92vw, 380px);
      padding: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    p {
      color: var(--muted);
      margin: 0 0 22px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 11px 12px;
      background: #0f1318;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 11px 12px;
      background: var(--accent);
      color: #08111f;
      border: 0;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .error {
      margin-top: 14px;
      color: var(--danger);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <form method="post">
    <h1>Personal AI Agent</h1>
    <p>Private access</p>

    <input
      type="hidden"
      name="csrf_token"
      value="{{ csrf_token }}"
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
      autofocus
    >

    <button type="submit">
      Sign in
    </button>

    {% if error %}
      <div class="error">
        {{ error }}
      </div>
    {% endif %}
  </form>
</body>
</html>
