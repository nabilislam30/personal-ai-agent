<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Personal AI Agent</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #11151a;
      --panel-2: #171c22;
      --border: #28303a;
      --text: #e8edf2;
      --muted: #98a4b3;
      --accent: #7aa2f7;
      --good: #8bd49c;
      --warn: #e6c384;
      --danger: #f7768e;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 290px 1fr;
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow: auto;
    }

    .brand h1 {
      font-size: 18px;
      margin: 0 0 6px;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .sessions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .session {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 10px;
      border-radius: 10px;
    }

    .session:hover,
    .session.active {
      background: var(--panel-2);
      border-color: var(--border);
    }

    .session-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .session-id {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .secondary-button,
    .primary-button {
      border-radius: 9px;
      padding: 9px 12px;
      border: 1px solid var(--border);
    }

    .secondary-button {
      background: var(--panel-2);
      color: var(--text);
    }

    .primary-button {
      background: var(--accent);
      border-color: var(--accent);
      color: #08111f;
      font-weight: 650;
    }

    .knowledge-box {
      border: 1px solid var(--border);
      background: var(--panel-2);
      border-radius: var(--radius);
      padding: 12px;
    }

    .knowledge-status {
      color: var(--muted);
      font-size: 11px;
      white-space: pre-wrap;
      line-height: 1.45;
      max-height: 180px;
      overflow: auto;
    }

    .upload-row {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .upload-row input {
      max-width: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 13, 16, 0.92);
    }

    .header-title {
      font-size: 14px;
      font-weight: 650;
    }

    .model-pill {
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
    }

    #messages {
      overflow-y: auto;
      padding: 28px max(24px, calc((100% - 880px) / 2));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 82%;
      border-radius: var(--radius);
      padding: 14px 16px;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .message.user {
      align-self: flex-end;
      background: #1d2b43;
      border: 1px solid #2d4366;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      max-width: 520px;
      line-height: 1.6;
    }

    .composer-wrap {
      border-top: 1px solid var(--border);
      padding: 16px max(24px, calc((100% - 880px) / 2));
      background: var(--bg);
    }

    .composer {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 12px;
    }

    textarea {
      width: 100%;
      min-height: 74px;
      max-height: 220px;
      resize: vertical;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      line-height: 1.5;
    }

    .composer-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .approval {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .approval input {
      accent-color: var(--accent);
    }

    .notice {
      margin-top: 8px;
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .notice.error {
      color: var(--danger);
    }

    .notice.good {
      color: var(--good);
    }

    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        display: none;
      }

      .message {
        max-width: 94%;
      }

      #messages,
      .composer-wrap {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <h1>Personal AI Agent</h1>
        <p>Local-first V2 workspace</p>
      </div>

      <section>
        <div class="section-title">
          <span>Sessions</span>
          <button
            class="secondary-button"
            id="newSessionButton"
            type="button"
          >New</button>
        </div>
        <div
          class="sessions"
          id="sessions"
        ></div>
      </section>

      <section>
        <div class="section-title">
          <span>Knowledge</span>
        </div>
        <div class="knowledge-box">
          <div
            class="knowledge-status"
            id="knowledgeStatus"
          >Loading…</div>

          <div class="upload-row">
            <input
              id="knowledgeFile"
              type="file"
              accept=".md,.txt,.pdf,.docx"
            >
            <button
              class="secondary-button"
              id="uploadButton"
              type="button"
            >Upload document</button>
            <button
              class="secondary-button"
              id="reindexButton"
              type="button"
            >Rebuild index</button>
          </div>

          <div
            class="notice"
            id="knowledgeNotice"
          ></div>
        </div>
      </section>
    </aside>

    <main>
      <header>
        <div>
          <div class="header-title" id="activeTitle">
            New session
          </div>
        </div>
        <div class="model-pill">
          {{ model }}
        </div>
      </header>

      <div id="messages">
        <div class="empty" id="emptyState">
          Ask about your projects, local knowledge,
          GitHub Actions, Terraform, AWS, documentation,
          research, or general work.
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea
            id="prompt"
            placeholder="Message your local agent…"
          ></textarea>

          <div class="composer-actions">
            <label class="approval">
              <input
                type="checkbox"
                id="approveWrites"
              >
              Approve write tools for this message
            </label>

            <button
              class="primary-button"
              id="sendButton"
              type="button"
            >Send</button>
          </div>
        </div>
        <div
          class="notice"
          id="chatNotice"
        ></div>
      </div>
    </main>
  </div>

  <script>
    const state = {
      activeSessionId: null,
      sessions: [],
      sending: false,
    };

    const sessionsEl =
      document.getElementById("sessions");
    const messagesEl =
      document.getElementById("messages");
    const emptyState =
      document.getElementById("emptyState");
    const activeTitle =
      document.getElementById("activeTitle");
    const promptEl =
      document.getElementById("prompt");
    const sendButton =
      document.getElementById("sendButton");
    const approveWrites =
      document.getElementById("approveWrites");
    const chatNotice =
      document.getElementById("chatNotice");
    const knowledgeStatus =
      document.getElementById("knowledgeStatus");
    const knowledgeNotice =
      document.getElementById("knowledgeNotice");
    const knowledgeFile =
      document.getElementById("knowledgeFile");

    function setNotice(
      element,
      message,
      type = ""
    ) {
      element.textContent = message;
      element.className =
        "notice" + (type ? " " + type : "");
    }

    function renderSessions() {
      sessionsEl.innerHTML = "";

      for (const session of state.sessions) {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className =
          "session" +
          (
            session.id === state.activeSessionId
              ? " active"
              : ""
          );

        const title =
          document.createElement("div");
        title.className = "session-title";
        title.textContent = session.title;

        const id =
          document.createElement("div");
        id.className = "session-id";
        id.textContent = session.short_id;

        button.append(title, id);
        button.addEventListener(
          "click",
          () => loadSession(session.id)
        );

        sessionsEl.appendChild(button);
      }
    }

    function renderMessages(messages) {
      messagesEl.innerHTML = "";

      if (!messages.length) {
        const empty =
          document.createElement("div");
        empty.className = "empty";
        empty.textContent =
          "Start a conversation with your local agent.";
        messagesEl.appendChild(empty);
        return;
      }

      for (const message of messages) {
        appendMessage(
          message.role,
          message.content
        );
      }

      messagesEl.scrollTop =
        messagesEl.scrollHeight;
    }

    function appendMessage(
      role,
      content
    ) {
      const bubble =
        document.createElement("div");

      bubble.className =
        "message " + role;
      bubble.textContent = content;

      const existingEmpty =
        messagesEl.querySelector(".empty");

      if (existingEmpty) {
        existingEmpty.remove();
      }

      messagesEl.appendChild(bubble);
      messagesEl.scrollTop =
        messagesEl.scrollHeight;
    }

    async function bootstrap() {
      const response =
        await fetch("/api/bootstrap");
      const data =
        await response.json();

      state.activeSessionId =
        data.active_session.id;
      state.sessions =
        data.sessions;

      activeTitle.textContent =
        data.active_session.title;

      knowledgeStatus.textContent =
        data.knowledge_status;

      renderSessions();
      renderMessages(data.messages);
    }

    async function refreshSessions() {
      const response =
        await fetch("/api/bootstrap");
      const data =
        await response.json();

      state.sessions =
        data.sessions;
      renderSessions();
    }

    async function loadSession(sessionId) {
      const response =
        await fetch(
          "/api/sessions/" +
          encodeURIComponent(sessionId)
        );

      const data =
        await response.json();

      if (!response.ok) {
        setNotice(
          chatNotice,
          data.error || "Could not load session.",
          "error"
        );
        return;
      }

      state.activeSessionId =
        data.session.id;
      activeTitle.textContent =
        data.session.title;

      renderSessions();
      renderMessages(data.messages);
      setNotice(chatNotice, "");
    }

    async function createSession() {
      const response =
        await fetch(
          "/api/sessions",
          {
            method: "POST",
          }
        );

      const data =
        await response.json();

      state.activeSessionId =
        data.session.id;
      state.sessions.unshift(
        data.session
      );

      activeTitle.textContent =
        data.session.title;

      renderSessions();
      renderMessages([]);
      promptEl.focus();
    }

    async function sendMessage() {
      const prompt =
        promptEl.value.trim();

      if (!prompt || state.sending) {
        return;
      }

      state.sending = true;
      sendButton.disabled = true;
      setNotice(
        chatNotice,
        "Agent is working…"
      );

      appendMessage(
        "user",
        prompt
      );

      promptEl.value = "";

      try {
        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json",
              },
              body: JSON.stringify(
                {
                  prompt,
                  session_id:
                    state.activeSessionId,
                  approve_writes:
                    approveWrites.checked,
                }
              ),
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Agent request failed."
          );
        }

        state.activeSessionId =
          data.session.id;
        activeTitle.textContent =
          data.session.title;

        appendMessage(
          "assistant",
          data.response
        );

        approveWrites.checked = false;

        await refreshSessions();

        setNotice(
          chatNotice,
          "Ready",
          "good"
        );
      } catch (error) {
        setNotice(
          chatNotice,
          error.message,
          "error"
        );
      } finally {
        state.sending = false;
        sendButton.disabled = false;
        promptEl.focus();
      }
    }

    async function uploadKnowledge() {
      const file =
        knowledgeFile.files[0];

      if (!file) {
        setNotice(
          knowledgeNotice,
          "Choose a file first.",
          "error"
        );
        return;
      }

      const form =
        new FormData();
      form.append("file", file);

      setNotice(
        knowledgeNotice,
        "Uploading…"
      );

      try {
        const response =
          await fetch(
            "/api/knowledge/upload",
            {
              method: "POST",
              body: form,
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Upload failed."
          );
        }

        knowledgeStatus.textContent =
          data.status;
        knowledgeFile.value = "";

        setNotice(
          knowledgeNotice,
          data.message,
          "good"
        );
      } catch (error) {
        setNotice(
          knowledgeNotice,
          error.message,
          "error"
        );
      }
    }

    async function rebuildKnowledge() {
      const confirmed =
        window.confirm(
          "Rebuild the local knowledge index now?"
        );

      if (!confirmed) {
        return;
      }

      setNotice(
        knowledgeNotice,
        "Rebuilding index…"
      );

      try {
        const response =
          await fetch(
            "/api/knowledge/reindex",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json",
              },
              body: JSON.stringify(
                {
                  confirm: true,
                }
              ),
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Index rebuild failed."
          );
        }

        knowledgeStatus.textContent =
          data.status;

        setNotice(
          knowledgeNotice,
          data.result,
          "good"
        );
      } catch (error) {
        setNotice(
          knowledgeNotice,
          error.message,
          "error"
        );
      }
    }

    document
      .getElementById(
        "newSessionButton"
      )
      .addEventListener(
        "click",
        createSession
      );

    document
      .getElementById(
        "uploadButton"
      )
      .addEventListener(
        "click",
        uploadKnowledge
      );

    document
      .getElementById(
        "reindexButton"
      )
      .addEventListener(
        "click",
        rebuildKnowledge
      );

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    promptEl.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Enter"
          && !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );

    bootstrap().catch(
      (error) => {
        setNotice(
          chatNotice,
          error.message,
          "error"
        );
      }
    );
  </script>
</body>
</html>
