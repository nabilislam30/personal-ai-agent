<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Personal AI Agent</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-soft: #f8fafd;
      --surface-hover: #f1f3f4;
      --border: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --accent: #1a73e8;
      --accent-soft: #e8f0fe;
      --good: #188038;
      --danger: #d93025;
      --shadow: 0 1px 2px rgba(60, 64, 67, .12),
        0 2px 6px rgba(60, 64, 67, .08);
      --drawer-width: 320px;
      --radius: 24px;
    }

    body[data-theme="dark"] {
      --bg: #0f1115;
      --surface: #15181d;
      --surface-soft: #1b1f24;
      --surface-hover: #232830;
      --border: #343a43;
      --text: #edf1f7;
      --muted: #a8b0bb;
      --accent: #8ab4f8;
      --accent-soft: #1b3151;
      --good: #81c995;
      --danger: #f28b82;
      --shadow: 0 1px 2px rgba(0, 0, 0, .26),
        0 4px 14px rgba(0, 0, 0, .18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
    }

    .icon-button:hover {
      background: var(--surface-hover);
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: relative;
      z-index: 20;
      background: color-mix(
        in srgb,
        var(--bg) 92%,
        transparent
      );
      backdrop-filter: blur(12px);
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-small {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    .health-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      background: var(--surface);
    }

    .health-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .health-pill.ready .health-dot {
      background: var(--good);
    }

    .shell {
      height: calc(100vh - 64px);
      position: relative;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 39;
      background: rgba(32, 33, 36, .28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(var(--drawer-width), 88vw);
      z-index: 40;
      transform: translateX(-105%);
      transition: transform .2s ease;
      background: var(--surface-soft);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
      overflow: hidden;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 650;
    }

    .new-chat {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 12px 14px;
      text-align: left;
      background: var(--accent-soft);
      color: var(--text);
      font-weight: 600;
    }

    .drawer-scroll {
      overflow-y: auto;
      min-height: 0;
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .drawer-section-title {
      margin: 2px 4px 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--muted);
      font-weight: 700;
    }

    .session-search {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }

    .sessions {
      display: grid;
      gap: 4px;
    }

    .session {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      border-radius: 10px;
      text-align: left;
      padding: 10px;
    }

    .session:hover,
    .session.active {
      background: var(--surface-hover);
    }

    .session-title {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-meta {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    .knowledge-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      padding: 12px;
    }

    .knowledge-status {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 130px;
      overflow: auto;
    }

    .knowledge-actions {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }

    .soft-button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 11px;
    }

    .soft-button:hover {
      background: var(--surface-hover);
    }

    .drawer-footer {
      display: grid;
      gap: 8px;
    }

    .drawer-footer form {
      margin: 0;
    }

    .drawer-footer button {
      width: 100%;
    }

    .main {
      height: 100%;
      display: grid;
      grid-template-rows: 1fr;
    }

    .home {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-y: auto;
    }

    .home-inner {
      width: min(760px, 100%);
      transform: translateY(-5vh);
      text-align: center;
    }

    .home-mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(
          135deg,
          #4285f4,
          #34a853 34%,
          #fbbc05 66%,
          #ea4335
        );
      color: #fff;
      font-size: 27px;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .home h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: -.035em;
      font-weight: 650;
    }

    .home-subtitle {
      margin: 10px auto 30px;
      color: var(--muted);
      font-size: 15px;
    }

    .search-composer {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 8px 8px 8px 20px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .search-composer:focus-within {
      border-color: color-mix(
        in srgb,
        var(--accent) 58%,
        var(--border)
      );
      box-shadow:
        0 1px 2px rgba(60, 64, 67, .14),
        0 5px 18px rgba(60, 64, 67, .12);
    }

    .search-composer textarea {
      flex: 1;
      min-width: 0;
      min-height: 46px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      line-height: 1.5;
      padding: 12px 0 9px;
    }

    .send-button {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      border: 0;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 700;
    }

    .send-button:disabled {
      opacity: .45;
      cursor: wait;
    }

    .quick-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 20px;
    }

    .quick-action {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 12px;
    }

    .quick-action:hover {
      background: var(--surface-hover);
    }

    .home-foot {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
    }

    .chat {
      height: 100%;
      display: none;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
    }

    .chat.active {
      display: grid;
    }

    .chat-head {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      padding: 0 18px;
    }

    .chat-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 70vw;
    }

    .messages {
      min-height: 0;
      overflow-y: auto;
      padding: 20px max(20px, calc((100% - 860px) / 2)) 32px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .message-row {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .message-row.user {
      align-items: flex-end;
    }

    .message-row.assistant {
      align-items: flex-start;
    }

    .message-label {
      font-size: 11px;
      color: var(--muted);
      margin: 0 5px 6px;
    }

    .message {
      max-width: min(760px, 86%);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.62;
      font-size: 15px;
    }

    .message-row.user .message {
      background: var(--surface-hover);
      padding: 12px 16px;
      border-radius: 20px 20px 6px 20px;
    }

    .message-row.assistant .message {
      padding: 3px 5px;
    }

    .turn-details {
      margin: 8px 5px 0;
      color: var(--muted);
      font-size: 11px;
    }

    .turn-details summary {
      cursor: pointer;
      user-select: none;
    }

    .composer-dock {
      padding: 12px max(20px, calc((100% - 860px) / 2)) 18px;
      background:
        linear-gradient(
          to top,
          var(--bg) 76%,
          color-mix(in srgb, var(--bg) 0%, transparent)
        );
    }

    .composer-options {
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .write-approval {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .write-approval input {
      accent-color: var(--accent);
    }

    .notice {
      min-height: 16px;
      text-align: right;
    }

    .notice.error {
      color: var(--danger);
    }

    .notice.good {
      color: var(--good);
    }

    .hidden-file {
      display: none;
    }

    @media (max-width: 720px) {
      .brand-small {
        display: none;
      }

      .health-pill span:last-child {
        display: none;
      }

      .home-inner {
        transform: translateY(-2vh);
      }

      .home-subtitle {
        margin-bottom: 22px;
      }

      .message {
        max-width: 94%;
      }

      .messages,
      .composer-dock {
        padding-left: 14px;
        padding-right: 14px;
      }

      .composer-options {
        align-items: flex-start;
        flex-direction: column;
      }

      .notice {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button
        class="icon-button"
        id="menuButton"
        type="button"
        aria-label="Open menu"
      >☰</button>
      <div class="brand-small">
        Personal AI Agent
      </div>
    </div>

    <div class="topbar-right">
      <div
        class="health-pill"
        id="healthPill"
        title="Application readiness"
      >
        <span class="health-dot"></span>
        <span id="healthText">Checking</span>
      </div>

      <button
        class="icon-button"
        id="themeButton"
        type="button"
        aria-label="Toggle theme"
        title="Toggle theme"
      >◐</button>
    </div>
  </header>

  <div
    class="drawer-backdrop"
    id="drawerBackdrop"
  ></div>

  <aside
    class="drawer"
    id="drawer"
    aria-label="Navigation"
  >
    <div class="drawer-head">
      <div class="drawer-title">
        Personal AI Agent
      </div>
      <button
        class="icon-button"
        id="closeDrawerButton"
        type="button"
        aria-label="Close menu"
      >✕</button>
    </div>

    <button
      class="new-chat"
      id="newSessionButton"
      type="button"
    >
      ＋ New conversation
    </button>

    <div class="drawer-scroll">
      <section>
        <div class="drawer-section-title">
          Conversations
        </div>

        <input
          class="session-search"
          id="sessionSearch"
          type="search"
          placeholder="Search conversations"
        >

        <div
          class="sessions"
          id="sessions"
        ></div>
      </section>

      <section>
        <div class="drawer-section-title">
          Knowledge
        </div>

        <div class="knowledge-card">
          <div
            class="knowledge-status"
            id="knowledgeStatus"
          >Loading…</div>

          <div class="knowledge-actions">
            <input
              class="hidden-file"
              id="knowledgeFile"
              type="file"
              accept=".md,.txt,.pdf,.docx"
            >

            <button
              class="soft-button"
              id="chooseFileButton"
              type="button"
            >
              Upload document
            </button>

            <button
              class="soft-button"
              id="reindexButton"
              type="button"
            >
              Rebuild knowledge index
            </button>
          </div>

          <div
            class="notice"
            id="knowledgeNotice"
          ></div>
        </div>
      </section>
    </div>

    <div class="drawer-footer">
      {% if auth_enabled %}
      <form
        action="/logout"
        method="post"
      >
        <input
          type="hidden"
          name="csrf_token"
          value="{{ csrf_token }}"
        >
        <button
          class="soft-button"
          type="submit"
        >
          Sign out
        </button>
      </form>
      {% endif %}
    </div>
  </aside>

  <main class="shell">
    <section
      class="home"
      id="homeView"
    >
      <div class="home-inner">
        <div class="home-mark">
          A
        </div>

        <h1>
          What can I help with?
        </h1>

        <div class="home-subtitle">
          Your private AI workspace, running on your own machine.
        </div>

        <div class="search-composer">
          <textarea
            id="homePrompt"
            rows="1"
            placeholder="Ask anything"
            aria-label="Ask anything"
          ></textarea>

          <button
            class="send-button"
            id="homeSendButton"
            type="button"
            aria-label="Send"
          >↑</button>
        </div>

        <div class="quick-actions">
          <button
            class="quick-action"
            type="button"
            data-prompt="Search my knowledge for "
          >Knowledge</button>

          <button
            class="quick-action"
            type="button"
            data-prompt="Show me my AWS environment in eu-west-2 and summarise what is running."
          >AWS</button>

          <button
            class="quick-action"
            type="button"
            data-prompt="Investigate the most recent failed GitHub Actions run."
          >DevOps</button>

          <button
            class="quick-action"
            type="button"
            data-prompt="Research "
          >Research</button>
        </div>

        <div class="home-foot">
          <span>Private</span>
          <span>•</span>
          <span>Local-first</span>
          <span>•</span>
          <span>{{ model }}</span>
          <span>•</span>
          <span>Ollama</span>
        </div>
      </div>
    </section>

    <section
      class="chat"
      id="chatView"
    >
      <div class="chat-head">
        <div
          class="chat-title"
          id="activeTitle"
        >New conversation</div>
      </div>

      <div
        class="messages"
        id="messages"
      ></div>

      <div class="composer-dock">
        <div class="search-composer">
          <textarea
            id="prompt"
            rows="1"
            placeholder="Ask a follow-up"
            aria-label="Ask a follow-up"
          ></textarea>

          <button
            class="send-button"
            id="sendButton"
            type="button"
            aria-label="Send"
          >↑</button>
        </div>

        <div class="composer-options">
          <label class="write-approval">
            <input
              type="checkbox"
              id="approveWrites"
            >
            Approve write tools for this message
          </label>

          <div
            class="notice"
            id="chatNotice"
          ></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const csrfToken =
      {{ csrf_token|tojson }};

    const state = {
      activeSessionId: null,
      sessions: [],
      sending: false,
    };

    const drawer =
      document.getElementById("drawer");
    const drawerBackdrop =
      document.getElementById("drawerBackdrop");
    const sessionsEl =
      document.getElementById("sessions");
    const sessionSearch =
      document.getElementById("sessionSearch");
    const homeView =
      document.getElementById("homeView");
    const chatView =
      document.getElementById("chatView");
    const messagesEl =
      document.getElementById("messages");
    const activeTitle =
      document.getElementById("activeTitle");
    const homePrompt =
      document.getElementById("homePrompt");
    const promptEl =
      document.getElementById("prompt");
    const homeSendButton =
      document.getElementById("homeSendButton");
    const sendButton =
      document.getElementById("sendButton");
    const approveWrites =
      document.getElementById("approveWrites");
    const chatNotice =
      document.getElementById("chatNotice");
    const knowledgeStatus =
      document.getElementById("knowledgeStatus");
    const knowledgeNotice =
      document.getElementById("knowledgeNotice");
    const knowledgeFile =
      document.getElementById("knowledgeFile");
    const healthPill =
      document.getElementById("healthPill");
    const healthText =
      document.getElementById("healthText");

    function openDrawer() {
      drawer.classList.add("open");
      drawerBackdrop.classList.add("open");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    function setNotice(
      element,
      message,
      type = ""
    ) {
      element.textContent = message;
      element.className =
        "notice" +
        (type ? " " + type : "");
    }

    function setTheme(theme) {
      document.body.dataset.theme = theme;
      localStorage.setItem("pai-theme", theme);
    }

    function initialiseTheme() {
      const stored =
        localStorage.getItem("pai-theme");

      if (stored) {
        setTheme(stored);
        return;
      }

      const prefersDark =
        window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

      setTheme(
        prefersDark ? "dark" : "light"
      );
    }

    function toggleTheme() {
      const current =
        document.body.dataset.theme;

      setTheme(
        current === "dark"
          ? "light"
          : "dark"
      );
    }

    function showHome() {
      homeView.style.display = "grid";
      chatView.classList.remove("active");
      homePrompt.focus();
    }

    function showChat() {
      homeView.style.display = "none";
      chatView.classList.add("active");
      promptEl.focus();
    }

    function sessionMatches(
      session,
      query
    ) {
      if (!query) {
        return true;
      }

      return (
        session.title
        .toLowerCase()
        .includes(
          query.toLowerCase()
        )
      );
    }

    function renderSessions() {
      const query =
        sessionSearch.value.trim();

      sessionsEl.innerHTML = "";

      for (const session of state.sessions) {
        if (!sessionMatches(session, query)) {
          continue;
        }

        const button =
          document.createElement("button");

        button.type = "button";
        button.className =
          "session" +
          (
            session.id ===
            state.activeSessionId
              ? " active"
              : ""
          );

        const title =
          document.createElement("div");
        title.className =
          "session-title";
        title.textContent =
          session.title;

        const meta =
          document.createElement("div");
        meta.className =
          "session-meta";
        meta.textContent =
          session.short_id;

        button.append(
          title,
          meta
        );

        button.addEventListener(
          "click",
          () => loadSession(
            session.id
          )
        );

        sessionsEl.appendChild(
          button
        );
      }
    }

    function renderMessages(
      messages
    ) {
      messagesEl.innerHTML = "";

      for (const message of messages) {
        appendMessage(
          message.role,
          message.content
        );
      }

      if (messages.length) {
        showChat();
      } else {
        showHome();
      }

      messagesEl.scrollTop =
        messagesEl.scrollHeight;
    }

    function appendMessage(
      role,
      content
    ) {
      const row =
        document.createElement("div");

      row.className =
        "message-row " + role;

      const label =
        document.createElement("div");

      label.className =
        "message-label";

      label.textContent =
        role === "user"
          ? "You"
          : "Agent";

      const bubble =
        document.createElement("div");

      bubble.className = "message";
      bubble.textContent = content;

      row.append(
        label,
        bubble
      );

      messagesEl.appendChild(
        row
      );

      messagesEl.scrollTop =
        messagesEl.scrollHeight;

      return {
        row,
        bubble,
      };
    }

    function addTurnDetails(
      row,
      event,
      routeName
    ) {
      const details =
        document.createElement("details");

      details.className =
        "turn-details";

      const summary =
        document.createElement("summary");

      summary.textContent =
        "Details";

      const body =
        document.createElement("div");

      const pieces = [
        "Route: " + routeName,
      ];

      if (
        event.first_token_ms
        !== null
        && event.first_token_ms
        !== undefined
      ) {
        pieces.push(
          "First token: " +
          Math.round(
            event.first_token_ms
          ) +
          " ms"
        );
      }

      if (
        event.total_ms
        !== null
        && event.total_ms
        !== undefined
      ) {
        pieces.push(
          "Total: " +
          (
            event.total_ms / 1000
          ).toFixed(2) +
          " s"
        );
      }

      pieces.push(
        "Tools: " +
        (event.tool_calls || 0)
      );

      body.textContent =
        pieces.join(" · ");

      details.append(
        summary,
        body
      );

      row.appendChild(
        details
      );
    }

    async function parseJson(
      response
    ) {
      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "Request failed."
        );
      }

      return data;
    }

    async function bootstrap() {
      const response =
        await fetch(
          "/api/bootstrap"
        );

      const data =
        await parseJson(
          response
        );

      state.activeSessionId =
        data.active_session.id;

      state.sessions =
        data.sessions;

      activeTitle.textContent =
        data.active_session.title;

      knowledgeStatus.textContent =
        data.knowledge_status;

      renderSessions();
      renderMessages(
        data.messages
      );

      checkHealth();
    }

    async function checkHealth() {
      try {
        const response =
          await fetch("/ready");

        if (response.ok) {
          healthPill.classList.add(
            "ready"
          );
          healthText.textContent =
            "Local";
          return;
        }
      } catch (_error) {
        // Fall through to unavailable state.
      }

      healthPill.classList.remove(
        "ready"
      );
      healthText.textContent =
        "Unavailable";
    }

    async function refreshSessions() {
      const response =
        await fetch(
          "/api/bootstrap"
        );

      const data =
        await parseJson(
          response
        );

      state.sessions =
        data.sessions;

      renderSessions();
    }

    async function loadSession(
      sessionId
    ) {
      const response =
        await fetch(
          "/api/sessions/" +
          encodeURIComponent(
            sessionId
          )
        );

      const data =
        await parseJson(
          response
        );

      state.activeSessionId =
        data.session.id;

      activeTitle.textContent =
        data.session.title;

      renderSessions();
      renderMessages(
        data.messages
      );
      setNotice(
        chatNotice,
        ""
      );
      closeDrawer();
    }

    async function createSession() {
      const response =
        await fetch(
          "/api/sessions",
          {
            method: "POST",
            headers: {
              "X-CSRF-Token":
                csrfToken,
            },
          }
        );

      const data =
        await parseJson(
          response
        );

      state.activeSessionId =
        data.session.id;

      state.sessions.unshift(
        data.session
      );

      activeTitle.textContent =
        data.session.title;

      renderSessions();
      renderMessages([]);
      closeDrawer();
    }

    function autoResize(
      textarea
    ) {
      textarea.style.height =
        "auto";

      textarea.style.height =
        Math.min(
          textarea.scrollHeight,
          180
        ) + "px";
    }

    async function sendMessage(
      rawPrompt
    ) {
      const prompt =
        rawPrompt.trim();

      if (
        !prompt
        || state.sending
      ) {
        return;
      }

      state.sending = true;
      sendButton.disabled = true;
      homeSendButton.disabled = true;

      showChat();

      appendMessage(
        "user",
        prompt
      );

      const assistant =
        appendMessage(
          "assistant",
          ""
        );

      promptEl.value = "";
      homePrompt.value = "";
      autoResize(promptEl);
      autoResize(homePrompt);

      setNotice(
        chatNotice,
        "Thinking…"
      );

      let routeName = "unknown";

      try {
        const response =
          await fetch(
            "/api/chat/stream",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json",
                "X-CSRF-Token":
                  csrfToken,
              },
              body: JSON.stringify(
                {
                  prompt,
                  session_id:
                    state.activeSessionId,
                  approve_writes:
                    approveWrites.checked,
                }
              ),
            }
          );

        if (!response.ok) {
          const data =
            await response.json();

          throw new Error(
            data.error ||
            "Agent request failed."
          );
        }

        const reader =
          response.body.getReader();

        const decoder =
          new TextDecoder();

        let buffer = "";

        while (true) {
          const {
            value,
            done,
          } = await reader.read();

          if (done) {
            break;
          }

          buffer += decoder.decode(
            value,
            {
              stream: true,
            }
          );

          const lines =
            buffer.split("\n");

          buffer =
            lines.pop() || "";

          for (const line of lines) {
            if (!line.trim()) {
              continue;
            }

            const event =
              JSON.parse(line);

            if (
              event.type === "meta"
            ) {
              routeName =
                event.route;

              setNotice(
                chatNotice,
                "Generating…"
              );
            }

            if (
              event.type === "token"
            ) {
              assistant.bubble
                .textContent +=
                event.content;

              messagesEl.scrollTop =
                messagesEl.scrollHeight;
            }

            if (
              event.type === "done"
            ) {
              setNotice(
                chatNotice,
                "Ready",
                "good"
              );

              addTurnDetails(
                assistant.row,
                event,
                routeName
              );
            }

            if (
              event.type === "error"
            ) {
              throw new Error(
                event.error ||
                "Agent stream failed."
              );
            }
          }
        }

        approveWrites.checked =
          false;

        await refreshSessions();

        const active =
          state.sessions.find(
            (item) =>
              item.id ===
              state.activeSessionId
          );

        if (active) {
          activeTitle.textContent =
            active.title;
        }

      } catch (error) {
        if (
          !assistant.bubble
          .textContent
        ) {
          assistant.row.remove();
        }

        setNotice(
          chatNotice,
          error.message,
          "error"
        );
      } finally {
        state.sending = false;
        sendButton.disabled = false;
        homeSendButton.disabled = false;
        promptEl.focus();
      }
    }

    async function uploadKnowledge() {
      const file =
        knowledgeFile.files[0];

      if (!file) {
        return;
      }

      const form =
        new FormData();

      form.append(
        "file",
        file
      );

      setNotice(
        knowledgeNotice,
        "Uploading…"
      );

      try {
        const response =
          await fetch(
            "/api/knowledge/upload",
            {
              method: "POST",
              headers: {
                "X-CSRF-Token":
                  csrfToken,
              },
              body: form,
            }
          );

        const data =
          await parseJson(
            response
          );

        knowledgeStatus.textContent =
          data.status;

        knowledgeFile.value = "";

        setNotice(
          knowledgeNotice,
          "Uploaded",
          "good"
        );

      } catch (error) {
        setNotice(
          knowledgeNotice,
          error.message,
          "error"
        );
      }
    }

    async function rebuildKnowledge() {
      const confirmed =
        window.confirm(
          "Rebuild the local knowledge index now?"
        );

      if (!confirmed) {
        return;
      }

      setNotice(
        knowledgeNotice,
        "Rebuilding…"
      );

      try {
        const response =
          await fetch(
            "/api/knowledge/reindex",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json",
                "X-CSRF-Token":
                  csrfToken,
              },
              body: JSON.stringify(
                {
                  confirm: true,
                }
              ),
            }
          );

        const data =
          await parseJson(
            response
          );

        knowledgeStatus.textContent =
          data.status;

        setNotice(
          knowledgeNotice,
          "Index updated",
          "good"
        );

      } catch (error) {
        setNotice(
          knowledgeNotice,
          error.message,
          "error"
        );
      }
    }

    document
      .getElementById(
        "menuButton"
      )
      .addEventListener(
        "click",
        openDrawer
      );

    document
      .getElementById(
        "closeDrawerButton"
      )
      .addEventListener(
        "click",
        closeDrawer
      );

    drawerBackdrop.addEventListener(
      "click",
      closeDrawer
    );

    document
      .getElementById(
        "themeButton"
      )
      .addEventListener(
        "click",
        toggleTheme
      );

    document
      .getElementById(
        "newSessionButton"
      )
      .addEventListener(
        "click",
        () => {
          createSession().catch(
            (error) => {
              setNotice(
                chatNotice,
                error.message,
                "error"
              );
            }
          );
        }
      );

    sessionSearch.addEventListener(
      "input",
      renderSessions
    );

    document
      .getElementById(
        "chooseFileButton"
      )
      .addEventListener(
        "click",
        () => {
          knowledgeFile.click();
        }
      );

    knowledgeFile.addEventListener(
      "change",
      uploadKnowledge
    );

    document
      .getElementById(
        "reindexButton"
      )
      .addEventListener(
        "click",
        rebuildKnowledge
      );

    sendButton.addEventListener(
      "click",
      () => sendMessage(
        promptEl.value
      )
    );

    homeSendButton.addEventListener(
      "click",
      () => sendMessage(
        homePrompt.value
      )
    );

    for (
      const button
      of document.querySelectorAll(
        ".quick-action"
      )
    ) {
      button.addEventListener(
        "click",
        () => {
          const prompt =
            button.dataset.prompt || "";

          homePrompt.value =
            prompt;

          autoResize(
            homePrompt
          );

          homePrompt.focus();

          if (
            !prompt.endsWith(" ")
          ) {
            sendMessage(prompt);
          }
        }
      );
    }

    for (
      const textarea
      of [
        homePrompt,
        promptEl,
      ]
    ) {
      textarea.addEventListener(
        "input",
        () => autoResize(
          textarea
        )
      );

      textarea.addEventListener(
        "keydown",
        (event) => {
          if (
            event.key === "Enter"
            && !event.shiftKey
          ) {
            event.preventDefault();

            sendMessage(
              textarea.value
            );
          }
        }
      );
    }

    initialiseTheme();

    bootstrap().catch(
      (error) => {
        setNotice(
          chatNotice,
          error.message,
          "error"
        );
      }
    );
  </script>
</body>
</html>
