name: Personal AI Agent CI

on:
  push:
    branches:
      - main
      - v1-finalization

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_failure:
        description: "Intentionally fail this run for pipeline investigation testing"
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: Validate Python Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python source
        run: python -m compileall main.py agent.py config.py permissions.py sessions.py tools prompts tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Intentional test failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_failure }}
        run: |
          echo "Intentional CI failure for AI pipeline investigation testing."
          exit 1
